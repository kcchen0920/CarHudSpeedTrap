name: Build CarHudSpeedTrap APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x CarHudSpeedTrap/gradlew

      - name: Build Debug APK
        run: |
          cd CarHudSpeedTrap
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CarHud-debug-apk
          path: CarHudSpeedTrap/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
