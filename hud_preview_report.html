<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarWebGuru 專屬整合 - 車機神盾科技橫條實機預覽</title>
  <style>
    :root {
      --bg-car: #080d1a;
      --panel-bg: rgba(15, 23, 42, 0.82);
      --accent-cyan: #00f2fe;
      --accent-blue: #00d2ff;
      --accent-purple: #8b5cf6;
      --accent-green: #10b981;
      --alert-red: #ff3366;
      --alert-pulse: rgba(255, 51, 102, 0.7);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #030712;
      color: var(--text-main);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1280px;
    }

    header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 14px;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #00f2fe 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 13px;
    }

    /* 控制面板 */
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      background: rgba(255, 255, 255, 0.04);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      align-items: center;
    }

    .btn {
      padding: 7px 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(0, 242, 254, 0.2);
      border-color: var(--accent-cyan);
    }

    .btn.active {
      background: linear-gradient(135deg, #00f2fe, #0072ff);
      border-color: transparent;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.5);
    }

    /* ====================================================
       1920x720 超寬長條車機螢幕模擬 (8:3 比例)
       ==================================================== */
    .car-screen {
      position: relative;
      width: 100%;
      height: 480px;
      background: radial-gradient(circle at 50% 30%, #111e38 0%, #060a14 100%);
      border: 4px solid #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
    }

    /* 頂部橫條：我們開發的神盾 HUD Widget */
    .widget-top-hud {
      height: 54px;
      width: 100%;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1.5px solid rgba(0, 242, 254, 0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 50;
      transition: all 0.3s ease;
    }

    .widget-top-hud.overspeed {
      border-bottom-color: var(--alert-red);
      background: rgba(35, 10, 20, 0.95);
      box-shadow: 0 4px 25px var(--alert-pulse);
    }

    /* 左：速限標誌 */
    .hud-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1.2;
    }

    .speed-limit-badge {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #ffffff;
      border: 4.5px solid #dc2626;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 900;
      font-size: 19px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }

    .hud-road-meta {
      display: flex;
      flex-direction: column;
    }

    .hud-road-name {
      font-size: 13px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: 0.3px;
    }

    .hud-road-status {
      font-size: 11px;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .dot-pulse {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 6px #10b981;
    }

    /* 中：測速照相動態進度條 */
    .hud-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 2;
      max-width: 420px;
    }

    .cam-info-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 4px;
    }

    .overspeed .cam-info-row {
      color: #ff3366;
      animation: alertBlink 0.8s infinite alternate;
    }

    @keyframes alertBlink {
      0% { opacity: 0.6; }
      100% { opacity: 1; text-shadow: 0 0 10px #ff3366; }
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 65%;
      background: linear-gradient(90deg, #00d2ff, #00f2fe);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .overspeed .progress-fill {
      background: linear-gradient(90deg, #f43f5e, #dc2626);
    }

    /* 右：車速與雙模切換膠囊 */
    .hud-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      flex: 1.5;
    }

    .speed-group {
      display: flex;
      align-items: baseline;
      gap: 3px;
    }

    .speed-number {
      font-size: 32px;
      font-weight: 900;
      font-family: "Impact", "Arial Black", sans-serif;
      line-height: 1;
      color: #ffffff;
    }

    .overspeed .speed-number {
      color: #ff3366;
    }

    .speed-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .btn-capsule {
      display: flex;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 3px;
      gap: 3px;
    }

    .capsule-item {
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      color: #94a3b8;
      transition: all 0.25s ease;
    }

    .capsule-item.active-aa {
      background: linear-gradient(135deg, #00d2ff, #0284c7);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
    }

    .capsule-item.active-wifi {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
    }

    /* ====================================================
       CarWebGuru 主介面模擬區 (科技儀表 + 音樂 + 導航)
       ==================================================== */
    .cwg-main-area {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr 280px;
      gap: 16px;
      padding: 16px 20px;
      position: relative;
    }

    /* 左卡片：跑車數位儀表 (RPM / 電池 / 檔位) */
    .cwg-card {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      backdrop-filter: blur(12px);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .dial-wrapper {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto;
      border-radius: 50%;
      border: 8px solid rgba(0, 242, 254, 0.15);
      border-top-color: #00f2fe;
      border-right-color: #00d2ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.2);
    }

    .dial-val {
      font-size: 34px;
      font-weight: 900;
      font-family: Impact, sans-serif;
      color: #fff;
    }

    .dial-sub {
      font-size: 11px;
      color: #00f2fe;
      letter-spacing: 1px;
    }

    .car-meta-row {
      display: flex;
      justify-content: space-around;
      font-size: 12px;
      color: #94a3b8;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 10px;
    }

    /* 中卡片：車載音樂播放器 */
    .cwg-music-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
    }

    .vinyl-record {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, #334155 35%, #0f172a 70%, #020617 100%);
      border: 4px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      animation: spin 12s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .vinyl-cover {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: url('https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=200&q=80') center/cover;
      border: 3px solid #00f2fe;
    }

    .track-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }

    .track-artist {
      font-size: 13px;
      color: #94a3b8;
    }

    .music-controls {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 18px;
      cursor: pointer;
    }

    /* 右卡片：常用 App 捷徑 (Google Maps / Spotify / YouTube / 神盾) */
    .app-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      height: 100%;
    }

    .app-tile {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .app-tile:hover {
      background: rgba(0, 242, 254, 0.15);
      border-color: #00f2fe;
    }

    .app-icon {
      font-size: 26px;
    }

    .app-name {
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 600;
    }

    /* 氣泡提示 */
    .toast-popup {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #00f2fe;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      color: #00f2fe;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      display: none;
      z-index: 99;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>CarWebGuru 專屬整合 - 車機神盾科技橫條實機輸出</h1>
      <p class="subtitle">1920x720 超寬長條車機視覺佈局 | 嵌入式置頂 AppWidget | 全自動喚醒神盾整合</p>
    </div>
  </header>

  <!-- 互動控制面板 -->
  <div class="controls">
    <span style="font-size: 13px; color: var(--text-muted);">🎮 效果切換：</span>
    <button class="btn active" onclick="setMode('normal')">情境 1：市區巡航 (54 km/h，距相機 350m)</button>
    <button class="btn" onclick="setMode('overspeed')">情境 2：超速警示 (72 km/h，紅光呼吸動態)</button>
    <button class="btn" onclick="triggerAutoLaunch()">情境 3：示範「全自動背景喚醒神盾」</button>
  </div>

  <!-- 1920x720 模擬車機螢幕 -->
  <div class="car-screen">

    <!-- 1. 置頂橫條：我們的神盾 HUD Widget (高度 54dp) -->
    <div class="widget-top-hud" id="topHud">
      <!-- 左：速限牌與路名 -->
      <div class="hud-left">
        <div class="speed-limit-badge" id="speedLimit">60</div>
        <div class="hud-road-meta">
          <span class="hud-road-name">信義路五段</span>
          <span class="hud-road-status">
            <span class="dot-pulse"></span>
            <span id="shieldStatusText">神盾背景常駐中</span>
          </span>
        </div>
      </div>

      <!-- 中：測速照相資訊與倒數進度條 -->
      <div class="hud-center">
        <div class="cam-info-row" id="camInfoRow">
          <span>📷 固定測速照相</span>
          <span id="camDistance">350 公尺</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width: 65%;"></div>
        </div>
      </div>

      <!-- 右：即時車速與 AA / Wi-Fi 切換膠囊 -->
      <div class="hud-right">
        <div class="speed-group">
          <span class="speed-number" id="speedNum">54</span>
          <span class="speed-label">KM/H</span>
        </div>

        <div class="btn-capsule">
          <div class="capsule-item active-aa" id="btnAA" onclick="toggleNetwork('aa')">🚗 AA</div>
          <div class="capsule-item" id="btnWifi" onclick="toggleNetwork('wifi')">📶 Wi-Fi</div>
        </div>
      </div>
    </div>

    <!-- 2. 下方主體：CarWebGuru 科技主題儀表板 -->
    <div class="cwg-main-area">

      <!-- 左側：數位轉速/電壓儀表 -->
      <div class="cwg-card">
        <div style="font-size: 12px; color: #64748b; font-weight: 700;">DIGITAL CLUSTER</div>
        <div class="dial-wrapper">
          <div class="dial-val" id="rpmVal">2.1</div>
          <div class="dial-sub">RPM x1000</div>
        </div>
        <div class="car-meta-row">
          <span>檔位: <b style="color: #00f2fe;">D</b></span>
          <span>電壓: <b style="color: #fff;">14.2V</b></span>
          <span>水溫: <b style="color: #fff;">88°C</b></span>
        </div>
      </div>

      <!-- 中間：車載音樂播放器 -->
      <div class="cwg-card cwg-music-center">
        <div class="vinyl-record">
          <div class="vinyl-cover"></div>
        </div>
        <div>
          <div class="track-title">Cyber City Drive</div>
          <div class="track-artist">Synthwave Radio 2026</div>
        </div>
        <div class="music-controls">
          <span>⏮️</span>
          <span style="font-size: 24px; color: #00f2fe;">⏸️</span>
          <span>⏭️</span>
        </div>
      </div>

      <!-- 右側：快捷應用程式導航 -->
      <div class="cwg-card">
        <div style="font-size: 12px; color: #64748b; font-weight: 700; margin-bottom: 8px;">QUICK LAUNCH</div>
        <div class="app-grid">
          <div class="app-tile" onclick="showPopup('🗺️ 正在開啟 Google Maps 導航...')">
            <span class="app-icon">🗺️</span>
            <span class="app-name">導航地圖</span>
          </div>
          <div class="app-tile" onclick="showPopup('🎵 開啟 Spotify 音樂')">
            <span class="app-icon">🎵</span>
            <span class="app-name">Spotify</span>
          </div>
          <div class="app-tile" onclick="showPopup('📺 開啟 YouTube')">
            <span class="app-icon">📺</span>
            <span class="app-name">YouTube</span>
          </div>
          <div class="app-tile" onclick="showPopup('🛡️ 神盾測速：背景運作中 (自動喚醒已生效)')">
            <span class="app-icon">🛡️</span>
            <span class="app-name">神盾狀態</span>
          </div>
        </div>
      </div>

    </div>

    <!-- 模擬 Toast -->
    <div class="toast-popup" id="toastPopup"></div>
  </div>
</div>

<script>
  const topHud = document.getElementById('topHud');
  const speedLimit = document.getElementById('speedLimit');
  const speedNum = document.getElementById('speedNum');
  const camDistance = document.getElementById('camDistance');
  const camInfoRow = document.getElementById('camInfoRow');
  const progressFill = document.getElementById('progressFill');
  const toast = document.getElementById('toastPopup');
  const btnAA = document.getElementById('btnAA');
  const btnWifi = document.getElementById('btnWifi');

  function setMode(mode) {
    document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');

    if (mode === 'normal') {
      topHud.classList.remove('overspeed');
      speedLimit.textContent = '60';
      speedNum.textContent = '54';
      camDistance.textContent = '350 公尺';
      camInfoRow.innerHTML = '<span>📷 固定測速照相</span><span id="camDistance">350 公尺</span>';
      progressFill.style.width = '65%';
    } else if (mode === 'overspeed') {
      topHud.classList.add('overspeed');
      speedLimit.textContent = '60';
      speedNum.textContent = '72';
      camInfoRow.innerHTML = '<span>⚠️ 超速警示！固定測速</span><span id="camDistance">140 公尺</span>';
      progressFill.style.width = '25%';
    }
  }

  function toggleNetwork(net) {
    if (net === 'aa') {
      btnAA.className = 'capsule-item active-aa';
      btnWifi.className = 'capsule-item';
      showPopup('🚗 一鍵切換：正在喚醒車機 Android Auto (ZLINK / AutoKit)...');
    } else {
      btnWifi.className = 'capsule-item active-wifi';
      btnAA.className = 'capsule-item';
      showPopup('📶 一鍵切換：已中斷 AA，自動連線至車載 Wi-Fi 手機熱點');
    }
  }

  function triggerAutoLaunch() {
    showPopup('⚡ [開機自啟測試] CarWebGuru 載入 Widget ➔ 自動背景喚醒神盾 ➔ 焦點壓回桌面 (已就緒)');
  }

  let timer;
  function showPopup(msg) {
    toast.textContent = msg;
    toast.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(() => {
      toast.style.display = 'none';
    }, 2800);
  }
</script>

</body>
</html>
